# SDI Milestone 1 stack:  docker compose up -d --build
#   Airflow UI  http://localhost:8080      Ingestion API docs  http://localhost:8000/docs
#   Grafana     http://localhost:3000 (admin / $GRAFANA_ADMIN_PASSWORD)      Postgres  localhost:5432
x-airflow-common: &airflow-common
  build: .
  image: sdi-airflow:3.1.8
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"      # local demo: no login
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    SDI_PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    SDI_INGEST_API_URL: http://ingest-api:8000
    SDI_INGEST_MODE: api
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/project/pipeline
    - ./sql:/opt/airflow/project/sql
    - ./scripts:/opt/airflow/project/scripts
    - ./data:/opt/airflow/project/data
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow pools set duckdb_mart 1 'DuckDB single-writer' && python -m pipeline.ingestion.ddl && echo init-done"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8080:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: always

  ingest-api:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "uvicorn pipeline.ingestion.api:app --host 0.0.0.0 --port 8000 --workers 2"
    working_dir: /opt/airflow/project
    ports: ["8000:8000"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: always

  file-watcher:                       # optional event-driven trigger:  docker compose --profile watcher up -d
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "python -m pipeline.ingestion.watcher_daemon"
    working_dir: /opt/airflow/project
    environment:
      <<: *airflow-env
      SDI_AIRFLOW_API: http://airflow-apiserver:8080/api/v2
    profiles: ["watcher"]
    restart: always

  grafana:
    image: grafana/grafana:12.2.0
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sdi-batch-ingestion.json
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pg-data:
  airflow-logs:
